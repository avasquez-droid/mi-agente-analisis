# Base: propuesta de Devoluciones (LUFRANSA) — devolución de IR por retenciones en la fuente que superan
# el impuesto causado (crédito tributario), solicitada ante el SRI como pago en exceso por ejercicio.
# El pago en exceso derivado de una resolución del SRI es otro servicio: pago_exceso_ir.
portada: DEVOLUCIÓN DEL IMPUESTO A LA RENTA
variables:
  ejercicios:
    descripcion: "Ejercicios y montos estimados [{anio, monto}]; basta con el año si no hay monto"
    ejemplo: [{anio: 2024, monto: 24665.48}, {anio: 2025, monto: 20301.60}]
    requerido: true
  porcentaje: {descripcion: "Honorario (%) sobre lo recuperado; por defecto el del tarifario", ejemplo: 7}
# Texto de la carta: "...relacionados con los servicios de <referencia>."
referencia: "devolución del Impuesto a la Renta {% set anios = v.ejercicios | map(attribute='anio') | list %}{{ 'del ejercicio fiscal ' ~ anios[0] if anios | length == 1 else 'de los ejercicios fiscales ' ~ (anios[:-1] | join(', ')) ~ ' y ' ~ anios[-1] }}"
asunto: >-
  el servicio profesional de recuperación de valores pagados en exceso por concepto de impuesto a
  la renta que mantiene hasta la presente fecha
antecedentes:
  - >-
    De conformidad con la Ley de Régimen Tributario Interno y la Ley de Equidad Tributaria, los
    contribuyentes pueden solicitar ante el Servicio de Rentas Internas la recuperación de los
    valores pagados en exceso y/o indebidamente por concepto de Impuesto a la Renta
    {%- set anios = v.ejercicios | map(attribute='anio') | list %}
    {{ 'del ejercicio fiscal ' ~ anios[0] if anios | length == 1 else 'de los ejercicios fiscales ' ~ (anios[:-1] | join(', ')) ~ ' y ' ~ anios[-1] }}.
  - >-
    A la presente fecha, la compañía {{ cliente.razon_social }}, en virtud de sus operaciones, habría
    pagado en exceso Impuesto a la Renta
    {%- set con_monto = v.ejercicios | selectattr('monto') | list %}
    {%- if con_monto %} por un valor aproximado de
    {%- for e in con_monto %} {{ e.monto | usd }} en {{ e.anio }}{{ ',' if loop.revindex > 2 else (' y' if loop.revindex == 2 else '') }}{% endfor %}{% endif %},
    por lo que se encuentra interesada en realizar el trámite administrativo correspondiente para
    recuperar los valores pagados a la Administración Tributaria.
objetivo: >-
  El objetivo del presente servicio es realizar el trámite administrativo de solicitud de
  devolución del Impuesto a la Renta.
alcance:
  - items:
      - Planificación de la presentación de los trámites, así como también del flujo de efectivo que ingresará a la compañía por la devolución contratada.
      - Recopilación de las retenciones en la fuente de impuesto a la renta realizadas por los clientes que constan con derecho a crédito en el listado de CPT emitido por el SRI.
      - Revisión y conciliación de mayores contables vs. información declarada en los formularios 101.
      - Presentación de la solicitud de pago en exceso de Impuesto a la Renta ante el SRI, acorde a la planificación presentada y aprobada por la Gerencia.
      - Atención a los requerimientos que realice el Servicio de Rentas Internas como parte del proceso de devolución del Impuesto a la Renta.
      - Obtención de la resolución favorable y seguimiento a la acreditación de los valores a favor de la empresa.
honorarios:
  filas:
    - servicio: Devolución del Impuesto a la Renta.       # texto fijo indicado por el área comercial
      honorario: "El honorario será del {{ v.porcentaje | pct }} + IVA calculado sobre los valores recuperados a favor de la compañía."
      forma_pago: Los honorarios se pagarán contra acreditación de la nota de crédito a favor de la compañía.
