# Base: propuesta 2025 (Devoluciones, CUSTOSECURITY) — pago en exceso de IR derivado de una resolución
# del SRI (p. ej. recurso de revisión que reduce un valor ya pagado). Distinto de devolucion_ir
# (crédito tributario por retenciones), que tiene su propia propuesta.
portada: ASESORÍA LEGAL Y TRIBUTARIA EN LA SOLICITUD DE PAGO EN EXCESO DEL IMPUESTO A LA RENTA
variables:
  ejercicio: {descripcion: "Ejercicio fiscal", ejemplo: 2025, requerido: true}
  antecedentes_caso: {descripcion: "Hechos del caso (liquidaciones, reclamos, resoluciones). Lista de párrafos", ejemplo: ["..."]}
  monto: {descripcion: "Valor estimado pagado en exceso (USD)", ejemplo: 8427.18}
# Texto de la carta: "...relacionados con los servicios de <referencia>."
referencia: "solicitud de pago en exceso del Impuesto a la Renta del ejercicio fiscal {{ v.ejercicio }}"
asunto: >-
  la asesoría legal y tributaria en la presentación de una solicitud de pago en exceso del
  Impuesto a la Renta del ejercicio fiscal {{ v.ejercicio }}
antecedentes:
  - >-
    {% if v.antecedentes_caso %}{{ v.antecedentes_caso | join('\n') }}{% else %}{{ cliente.razon_social }}
    mantiene valores pagados por Impuesto a la Renta del ejercicio fiscal {{ v.ejercicio }} que
    superan el impuesto causado{% if v.monto %}, por aproximadamente {{ v.monto | usd }}{% endif %}, los cuales
    pueden ser recuperados mediante una solicitud de pago en exceso ante el Servicio de Rentas
    Internas.{% endif %}
objetivo: >-
  Obtener, a través de la resolución administrativa correspondiente, el reconocimiento de los
  valores pagados en exceso por el contribuyente y que se ordene su devolución.
alcance:
  - items:
      - Análisis de la información y de las resoluciones emitidas por el Servicio de Rentas Internas.
      - Determinación del monto sujeto a devolución.
      - Redacción y presentación de la solicitud formal.
      - Elaboración y presentación de los escritos y solicitudes que sean necesarios dentro del proceso administrativo.
      - Obtención de la resolución que reconozca los valores pagados en exceso y ordene su devolución.
honorarios:
  filas:
    - servicio: "Asesoría y presentación de la solicitud de pago en exceso por el ejercicio fiscal {{ v.ejercicio }}."
      honorario: "Un honorario variable del {{ v.porcentaje | pct }} más IVA calculado sobre los valores que efectivamente se obtengan a favor de la compañía, incluidos intereses."
      forma_pago: El 100 % del honorario se pagará cuando el Servicio de Rentas Internas emita la resolución que reconozca los valores pagados en exceso y la nota de crédito desmaterializada.
  notas:
    - {confirmar: gastos, texto: Los honorarios no incluyen gastos en que se pueda incurrir dentro del trámite.}
